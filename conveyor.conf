// This is a hashbang include. You can run the command after the #! to see what
// configuration is being extracted from the Gradle build using the Conveyor plugin.
include "#!./gradlew -q app:jvm:printConveyorConfig"

// This enables native library extraction, which improves app startup time and robustness.
// It is optional but a good idea to have it. You can remove this if you get tired of specifying
// system properties for Java libraries with native components.
//
// See https://hydraulic.dev/blog/11-in-jar-signing.html for more.
include required("https://raw.githubusercontent.com/hydraulic-software/conveyor/master/configs/jvm/extract-native-libraries.conf")

// Config file documentation: https://conveyor.hydraulic.dev/latest/configs
app {
  machines = [windows.amd64, linux.amd64.glibc]
  // The base URL is where the download site will be placed. Packages will check here for updates.
  // site.base-url = "localhost:3000"

  // This is optional. If not specified the last component of the rdns name will be turned into a display name.
  display-name = "MultiComicViewer"

  // A global identifier for the app.
  rdns-name = "com.sorrowblue.comicviewer"

  // Use the Compose logo as an icon and include it so we can pass it to the Window constructor.
  icons = "docs/images/icon.svg"

  // For iteration speed. Remove for release.
  compression-level = low

  // Check for and apply updates synchronously on every app launch instead of in the background.
  // updates = aggressive

  license = "Apache-2.0"
  vcs-url = "https://github.com/SorrowBlue/ComicViewer"
  site.consistency-checks = warn

  // windows.amd64 {
  //   inputs += {
  //     from = "https://repo1.maven.org/maven2/org/jetbrains/skiko/skiko-awt-runtime-windows-x64/0.144.6/skiko-awt-runtime-windows-x64-0.144.6.jar"
  //   }
  // }
  windows {
    store {
      identity-name = "SorrowBlue.MultiComicViewer"
      publisher = "CN=71D7B114-8405-455A-92A9-B9E773C4EB4F"
      publisher-display-name = "SorrowBlue"
      store-id = "9N3XXRFZ4G1R"
    }
  }
}

conveyor.compatibility-level = 22
