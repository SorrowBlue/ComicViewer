// This is a hashbang include. You can run the command after the #! to see what
// configuration is being extracted from the Gradle build using the Conveyor plugin.
include "#!./gradlew -q app:jvmApp:printConveyorConfig"

// This enables native library extraction, which improves app startup time and robustness.
// It is optional but a good idea to have it. You can remove this if you get tired of specifying
// system properties for Java libraries with native components.
//
// See https://hydraulic.dev/blog/11-in-jar-signing.html for more.
include required("https://raw.githubusercontent.com/hydraulic-software/conveyor/master/configs/jvm/extract-native-libraries.conf")

// Config file documentation: https://conveyor.hydraulic.dev/latest/configs
app {
  machines = [linux.amd64.glibc, mac.amd64, mac.aarch64]
  machines = ${?BUILD_WINDOWS_MACHINES}
  // The base URL is where the download site will be placed. Packages will check here for updates.
  // site.base-url = "localhost:3000"

  // This is optional. If not specified the last component of the rdns name will be turned into a display name.
  display-name = "MultiComicViewer"

  // A global identifier for the app.
  rdns-name = "com.sorrowblue.comicviewer"

  // Use the Compose logo as an icon and include it so we can pass it to the Window constructor.
  icons = "docs/images/icon.svg"

  // For iteration speed. Remove for release.
  compression-level = low

  // Check for and apply updates synchronously on every app launch instead of in the background.
  // updates = aggressive

  license = "Apache-2.0"
  vcs-url = "https://github.com/SorrowBlue/ComicViewer"
  site.consistency-checks = warn

  site {
    extra-header-html = """
      <script type="module" src="https://get.microsoft.com/badge/ms-store-badge.bundled.js"></script>
      <style>
        /* 1. 各画面の「Sorry, this application...」警告文を一瞬も表示させないためのCSS */
        #no-go p,
        #pane-win > p {
          display: none !important;
        }

        /* 2. 強制的に左右中央揃えにするためのFlexboxコンテナ */
        .ms-store-container {
          display: flex !important;
          justify-content: center !important;
          align-items: center !important;
          width: 100% !important;
          margin: 20px auto 10px auto !important;
          padding: 0 !important;
          box-sizing: border-box !important;
        }

        /* 4. バッジ自体の表示サイズ調整（固定幅を削除し、コンポーネント自体の幅に合わせる） */
        ms-store-badge {
          display: inline-flex !important;
          justify-content: center !important;
          align-items: center !important;
          margin: 0 auto !important;
          width: auto !important;
        }
      </style>
      <script>
        document.addEventListener("DOMContentLoaded", function() {
          try {
            // A. macOS / Linux の「Other platforms」リストに Windows (Store) への切り替えリンクを追加する
            function addWindowsLink() {
              try {
                const panes = ['pane-mac', 'pane-linux'];
                panes.forEach(paneId => {
                  const pane = document.getElementById(paneId);
                  if (pane) {
                    const altDownloads = pane.querySelector('.alternative-downloads');
                    if (altDownloads) {
                      // 既にWindowsへのリンクが存在しないかチェックして追加
                      if (!altDownloads.querySelector('a[href*="showOS(\'win\')"]')) {
                        const winLink = document.createElement('a');
                        winLink.href = "javascript:showOS('win')";
                        winLink.textContent = "Windows";
                        altDownloads.appendChild(winLink);
                      }
                    }
                  }
                });
              } catch (e) {
                console.error("Failed to add Windows link:", e);
              }
            }

            // B. Windows用画面の中に直接ストアバッジを挿入する
            function injectBadge() {
              try {
                // Windows用ペイン (#pane-win) への挿入 (Windows PCからのアクセス時)
                const paneWin = document.getElementById('pane-win');
                if (paneWin) {
                  if (!paneWin.querySelector('ms-store-badge')) {
                    const badgeWrapper = document.createElement('div');
                    badgeWrapper.className = 'ms-store-container';

                    const badge = document.createElement('ms-store-badge');
                    badge.setAttribute('productid', '9N3XXRFZ4G1R');
                    badge.setAttribute('cid', 'conveyor_campaign');
                    badge.setAttribute('window-mode', 'full');
                    badge.setAttribute('theme', 'auto');
                    badge.setAttribute('animation', 'on');
                    
                    badgeWrapper.appendChild(badge);
                    
                    // 「Other platforms」のリンクの直前に挿入することで綺麗に配置
                    const altDownloads = paneWin.querySelector('.alternative-downloads');
                    if (altDownloads) {
                      paneWin.insertBefore(badgeWrapper, altDownloads);
                    } else {
                      paneWin.appendChild(badgeWrapper);
                    }
                  }
                }

                // 全体非対応画面 (#no-go) への挿入 (モバイル等からのアクセス時)
                const noGo = document.getElementById('no-go');
                if (noGo) {
                  if (!noGo.querySelector('ms-store-badge')) {
                    const badgeWrapper = document.createElement('div');
                    badgeWrapper.className = 'ms-store-container';

                    const badge = document.createElement('ms-store-badge');
                    badge.setAttribute('productid', '9N3XXRFZ4G1R');
                    badge.setAttribute('cid', 'conveyor_campaign');
                    badge.setAttribute('window-mode', 'full');
                    badge.setAttribute('theme', 'auto');
                    badge.setAttribute('animation', 'on');
                    
                    badgeWrapper.appendChild(badge);
                    noGo.appendChild(badgeWrapper);
                  }
                }
              } catch (e) {
                console.error("Store badge injection failed:", e);
              }
            }

            // 即座に実行
            addWindowsLink();
            injectBadge();
            
            setTimeout(function() {
              addWindowsLink();
              injectBadge();
            }, 100);
            
            setTimeout(function() {
              addWindowsLink();
              injectBadge();
            }, 500);

            // DOM変更の監視（ユーザーが切り替え操作を行っても追従する）
            if (document.body) {
              const observer = new MutationObserver(function() {
                addWindowsLink();
                injectBadge();
              });
              observer.observe(document.body, { childList: true, subtree: true });
            }
          } catch (globalError) {
            console.error("Global script error on download site:", globalError);
          }
        });
      </script>
    """
  }

  mac {
    check-binary-versions = false
  }
  windows {
    store {
      identity-name = ${?MS_STORE_IDENTITY_NAME}
      publisher = ${?MS_STORE_PUBLISHER}
      publisher-display-name = ${?MS_STORE_PUBLISHER_DISPLAY_NAME}
      store-id = ${?MS_STORE_APP_ID}

      // Microsoft Store API連携用クレデンシャル
      client-id = ${?MS_STORE_CLIENT_ID}
      client-secret = ${?MS_STORE_CLIENT_SECRET}
      tenant-id = ${?MS_STORE_TENANT_ID}
    }
  }
}

conveyor.compatibility-level = 22
