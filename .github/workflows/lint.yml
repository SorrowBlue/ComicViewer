name: Lint

on:
  workflow_call:
    inputs:
      full-check:
        description: 'Whether to run all lint variants (true on main/schedule, false on PR)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  checks: write
  security-events: write

jobs:
  analyze:
    if: ${{ inputs.full-check || !matrix.full_only }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "Detekt"
            task: "reportMerge --continue"
            sarif_file: "build/reports/detekt/merge.sarif"
            category: "detekt"
            full_only: false
          - name: "Detekt (build-logic)"
            task: ":build-logic:detektMain"
            sarif_file: "build-logic/build/reports/detekt/main.sarif"
            category: "detekt-build-logic"
            full_only: false
          - name: "VersionCatalog"
            task: "checkVersionCatalog"
            full_only: false
          - name: "lintDebug"
            task: "app:androidApp:lintDebug"
            sarif_file: "app/androidApp/build/reports/lint-results-debug.sarif"
            category: "android-lint-debug"
            full_only: false
          - name: "lintInternal"
            task: "app:androidApp:lintInternal"
            sarif_file: "app/androidApp/build/reports/lint-results-internal.sarif"
            category: "android-lint-internal"
            full_only: true
          - name: "lintPrerelease"
            task: "app:androidApp:lintPrerelease"
            sarif_file: "app/androidApp/build/reports/lint-results-prerelease.sarif"
            category: "android-lint-prerelease"
            full_only: true
          - name: "lintRelease"
            task: "app:androidApp:lintRelease"
            sarif_file: "app/androidApp/build/reports/lint-results-release.sarif"
            category: "android-lint-release"
            full_only: true
    name: 🔍️ ${{ matrix.name || matrix.task }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: 🔍️Run analyze ${{ matrix.name || matrix.task }}
        run: ./gradlew ${{ matrix.task }}
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: ${{ !cancelled() && matrix.sarif_file && matrix.category }}
        with:
          sarif_file: ${{ matrix.sarif_file }}
          category: ${{ matrix.category }}

  nav-check:
    name: 🗺️ Navigation Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: 🗺️ Check navigation drift
        run: ./gradlew navCheck
      - name: 🖼️ Export navigation diff on failure
        if: failure()
        run: ./gradlew exportNavDiffImage exportNavDiffHtml --continue || true
      - name: 📦 Upload navigation diff artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nav-diff
          path: '**/build/navgraph/nav-diff.*'
          if-no-files-found: ignore
