name: Gemini Renovate Investigation

on:
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Target Pull Request number to investigate'
        required: true
        type: number

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  investigate-and-fix:
    name: Investigate Renovate PR
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.head_ref, 'renovate/') &&
        github.actor != 'github-actions[bot]' &&
        !contains(github.event.pull_request.body, '**Automerge**: Enabled') &&
        github.event.pull_request.auto_merge == null
      )
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GEMINI_RENOVATE_GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Prepare PR context
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GEMINI_RENOVATE_GH_PAT || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          GCP_PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT || vars.GOOGLE_CLOUD_PROJECT }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GEMINI_SERVICE_ACCOUNT }}
          FORCE_FREE_TIER: ${{ vars.GEMINI_USE_FREE_TIER }}
          MAX_MONTHLY_VERTEX_RUNS: ${{ vars.GEMINI_MAX_MONTHLY_VERTEX_RUNS || '80' }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            gh pr checkout "$PR_NUMBER"
          fi

          if [ -z "$GCP_PROJECT_ID" ] && [[ "$GCP_SERVICE_ACCOUNT" == *@*.iam.gserviceaccount.com ]]; then
            GCP_PROJECT_ID="${GCP_SERVICE_ACCOUNT#*@}"
            GCP_PROJECT_ID="${GCP_PROJECT_ID%.iam.gserviceaccount.com}"
          fi

          CURRENT_MONTH=$(date -u +"%Y-%m")
          MONTHLY_RUNS=$(gh run list --workflow=gemini-renovate.yml --created ">=${CURRENT_MONTH}-01" --status success --limit 200 --json databaseId --jq 'length' || echo "0")
          echo "Monthly successful runs in ${CURRENT_MONTH}: ${MONTHLY_RUNS} / ${MAX_MONTHLY_VERTEX_RUNS}"

          USE_VERTEX="true"
          if [ "$FORCE_FREE_TIER" = "true" ] || [ -z "$GCP_PROJECT_ID" ]; then
            USE_VERTEX="false"
          elif [ "$MONTHLY_RUNS" -ge "$MAX_MONTHLY_VERTEX_RUNS" ]; then
            echo "Monthly Vertex AI run cap (${MAX_MONTHLY_VERTEX_RUNS}) reached. Switching to AI Studio Free Tier to prevent exceeding monthly benefit credits."
            USE_VERTEX="false"
          fi

          BASE_REF=$(gh pr view "$PR_NUMBER" --json baseRefName --jq '.baseRefName')
          HEAD_REF=$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName')
          PR_TITLE=$(gh pr view "$PR_NUMBER" --json title --jq '.title')

          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body' || true)
          PR_BODY="${PR_BODY:0:30000}"
          git fetch origin "$BASE_REF"
          PR_DIFF=$(git diff "origin/${BASE_REF}...HEAD" -- . ':!.github/workflows/gemini-renovate.yml' || true)
          if [ -z "$PR_DIFF" ]; then
            PR_DIFF=$(git diff "origin/${BASE_REF}...HEAD" || true)
          fi
          PR_DIFF="${PR_DIFF:0:20000}"

          set +eo pipefail
          USAGE_CONTEXT=""
          if ! git diff --quiet "origin/${BASE_REF}...HEAD" -- gradle/libs.versions.toml; then
            CHANGED_KEYS=$(git diff -U0 "origin/${BASE_REF}...HEAD" -- gradle/libs.versions.toml \
              | grep -E '^\+[a-zA-Z0-9_-]+[[:space:]]*=' \
              | sed -E 's/^\+([a-zA-Z0-9_-]+)[[:space:]]*=.*/\1/' \
              | sort -u)

            for KEY in $CHANGED_KEYS; do
              TOML_DEFS=$(grep -nE "version\.ref[[:space:]]*=[[:space:]]*\"${KEY}\"" gradle/libs.versions.toml)
              USAGE_CONTEXT+="### Version Key: ${KEY}"$'\n'
              if [ -n "$TOML_DEFS" ]; then
                USAGE_CONTEXT+="#### gradle/libs.versions.toml 定義:"$'\n'"\`\`\`toml"$'\n'"${TOML_DEFS}"$'\n'"\`\`\`"$'\n'
              fi

              ALIASES=$(printf '%s\n' "$TOML_DEFS" | sed -E 's/^[0-9]+:([a-zA-Z0-9_-]+)[[:space:]]*=.*/\1/' | tr '-' '.')
              MAVEN_GROUPS=$(printf '%s\n' "$TOML_DEFS" | sed -nE 's/.*group[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' | sort -u)

              if [ -n "$ALIASES" ]; then
                GRADLE_USAGES=""
                for ALIAS in $ALIASES; do
                  for PREFIX in "libs.${ALIAS}" "libs.plugins.${ALIAS}" "libs.bundles.${ALIAS}"; do
                    MATCHES=$(git grep -n -F "$PREFIX" -- '*.gradle.kts' 'build-logic/**')
                    if [ -n "$MATCHES" ]; then
                      GRADLE_USAGES+="${MATCHES}"$'\n'
                    fi
                  done
                done
                if [ -n "$GRADLE_USAGES" ]; then
                  GRADLE_USAGES=$(printf '%s' "$GRADLE_USAGES" | sort -u)
                  USAGE_CONTEXT+="#### ビルドスクリプト内の参照箇所:"$'\n'"\`\`\`text"$'\n'"${GRADLE_USAGES}"$'\n'"\`\`\`"$'\n'
                fi
              fi

              if [ -n "$MAVEN_GROUPS" ]; then
                KT_IMPORTS=""
                for GRP in $MAVEN_GROUPS; do
                  IMPORTS=$(git grep -n "import ${GRP}" -- '*.kt')
                  if [ -z "$IMPORTS" ]; then
                    CLEAN_KEY=$(printf '%s\n' "$KEY" | tr '[:upper:]' '[:lower:]' | sed 's/-.*//')
                    IMPORTS=$(git grep -n -i "import .*${CLEAN_KEY}" -- '*.kt')
                  fi
                  if [ -n "$IMPORTS" ]; then
                    KT_IMPORTS+="${IMPORTS}"$'\n'
                  fi
                done
                if [ -n "$KT_IMPORTS" ]; then
                  KT_IMPORTS="${KT_IMPORTS:0:8000}"
                  USAGE_CONTEXT+="#### Kotlin ソース内の import 箇所:"$'\n'"\`\`\`text"$'\n'"${KT_IMPORTS}"$'\n'"\`\`\`"$'\n'
                fi
              fi
            done
          fi

          if [ -z "$USAGE_CONTEXT" ]; then
            USAGE_CONTEXT="（Version Catalog 以外の変更、または事前抽出された import 箇所はありません）"
          fi
          USAGE_CONTEXT="${USAGE_CONTEXT:0:15000}"
          set -eo pipefail

          SETTINGS_DELIMITER="SETTINGS_EOF_${RANDOM}_${RANDOM}"
          PROMPT_DELIMITER="PROMPT_EOF_${RANDOM}_${RANDOM}"

          {
            echo "should-run=true"
            echo "use-vertex=${USE_VERTEX}"
            echo "pr-number=${PR_NUMBER}"
            echo "base-ref=${BASE_REF}"
            echo "head-ref=${HEAD_REF}"
            echo "pr-title=${PR_TITLE}"
            echo "gcp-project-id=${GCP_PROJECT_ID}"
            echo "settings<<${SETTINGS_DELIMITER}"
            cat << 'EOF'
          {
            "model": {
              "maxSessionTurns": 5
            },
            "telemetry": {
              "enabled": false
            },
            "tools": {
              "core": [
                "read_file",
                "glob",
                "grep_search",
                "list_directory",
                "web_fetch"
              ],
              "allowed": [
                "read_file",
                "glob",
                "grep_search",
                "list_directory",
                "web_fetch"
              ]
            }
          }
          EOF
            echo "${SETTINGS_DELIMITER}"
            echo "prompt<<${PROMPT_DELIMITER}"
            cat << 'EOF'
          あなたは ComicViewer プロジェクトのシニアエンジニア AI エージェントです。
          Renovate によって作成されたライブラリ・プラグイン更新 PR について、バージョンアップの内容とプロジェクトへの影響範囲を調査し、日本語で調査レポートを作成してください。

          ## 重要な制約事項（厳守）
          - **コードの修正・ファイル書き込み・ビルド実行は一切行わないでください**（調査とレポート出力のみ）。
          - セッションの最大ターン数は **5 ターン** に制限されています。ツール呼び出しは最小限（最大 2〜3 回まで）にとどめてください。
          - 下記の「PR 差分」「PR 本文（Release Notes）」「事前抽出されたプロジェクト内の利用箇所」だけで影響範囲が判断できる場合は、**ツールを一切呼ばずに 1 ターン目で直接最終レポートを出力**してください。
          - ソースコード内の具体的な API 利用方法を確認する必要がある場合のみ、事前抽出リストに記載されたファイルを `read_file`（または最小限の `grep_search`）で確認し、直ちに最終レポートを出力してください。
          - あなたの最終回答（標準出力）がそのまま PR コメントとして投稿されます。挨拶や前置きは含めず、以下の Markdown フォーマットのみを出力してください。

          ## 出力フォーマット
          ## 🤖 Gemini ライブラリ更新調査レポート
          ### 📦 更新対象
          （更新されたライブラリ・プラグイン名と更新前後のバージョン）
          ### 🔍 主な変更点・破壊的変更
          （リリースノートや Changelog から判明した新機能・挙動変更・非推奨化・破壊的変更の要点）
          ### 🎯 プロジェクトへの影響範囲
          （該当ライブラリを使用しているモジュール・クラスと、今回の変更による具体的な影響の有無）
          ### 🛠️ 対応要否の判定
          （そのままマージ可能か、手動でのコード修正・確認が必要か、およびその根拠）

          ---

          ## コンテキスト情報
          EOF
            printf -- '- PR 番号: #%s\n' "$PR_NUMBER"
            printf -- '- PR タイトル: %s\n\n' "$PR_TITLE"
            printf -- '### PR 差分 (git diff)\n```diff\n%s\n```\n\n' "$PR_DIFF"
            printf -- '### 事前抽出されたプロジェクト内の利用箇所\n%s\n\n' "$USAGE_CONTEXT"
            printf -- '### PR 本文 (Release Notes / Changelog)\n%s\n' "$PR_BODY"
            echo "${PROMPT_DELIMITER}"
          } >> "$GITHUB_OUTPUT"
          echo "Context prepared successfully (PR #${PR_NUMBER}, use-vertex=${USE_VERTEX})"

      - name: Run Gemini CLI via Vertex AI (GCP Credits)
        id: gemini_vertex
        if: >-
          steps.prepare.outputs.should-run == 'true' &&
          steps.prepare.outputs.use-vertex == 'true'
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GH_TOKEN: ${{ secrets.GEMINI_RENOVATE_GH_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.prepare.outputs.pr-number }}
          BASE_REF: ${{ steps.prepare.outputs.base-ref }}
          HEAD_REF: ${{ steps.prepare.outputs.head-ref }}
          PR_TITLE: ${{ steps.prepare.outputs.pr-title }}
        with:
          use_vertex_ai: 'true'
          gcp_project_id: ${{ steps.prepare.outputs.gcp-project-id }}
          gcp_location: ${{ vars.GOOGLE_CLOUD_LOCATION || 'global' }}
          gcp_workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GEMINI_SERVICE_ACCOUNT }}
          github_pr_number: ${{ steps.prepare.outputs.pr-number }}
          settings: ${{ steps.prepare.outputs.settings }}
          prompt: ${{ steps.prepare.outputs.prompt }}

      - name: Run Gemini CLI via AI Studio Free Tier (Fallback)
        id: gemini_free
        if: >-
          steps.prepare.outputs.should-run == 'true' &&
          (steps.prepare.outputs.use-vertex != 'true' || steps.gemini_vertex.outcome != 'success')
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GOOGLE_APPLICATION_CREDENTIALS: ''
          GOOGLE_GHA_CREDS_PATH: ''
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ''
          GOOGLE_CLOUD_PROJECT: ''
          GCLOUD_PROJECT: ''
          GCP_PROJECT: ''
          CLOUDSDK_CORE_PROJECT: ''
          CLOUDSDK_PROJECT: ''
          GH_TOKEN: ${{ secrets.GEMINI_RENOVATE_GH_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.prepare.outputs.pr-number }}
          BASE_REF: ${{ steps.prepare.outputs.base-ref }}
          HEAD_REF: ${{ steps.prepare.outputs.head-ref }}
          PR_TITLE: ${{ steps.prepare.outputs.pr-title }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_FREE_API_KEY || secrets.GEMINI_API_KEY }}
          github_pr_number: ${{ steps.prepare.outputs.pr-number }}
          settings: ${{ steps.prepare.outputs.settings }}
          prompt: ${{ steps.prepare.outputs.prompt }}

      - name: Post investigation report to PR
        if: steps.prepare.outputs.should-run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GEMINI_RENOVATE_GH_PAT || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.prepare.outputs.pr-number }}
          VERTEX_OUTCOME: ${{ steps.gemini_vertex.outcome }}
          FREE_OUTCOME: ${{ steps.gemini_free.outcome }}
          GEMINI_SUMMARY: ${{ steps.gemini_vertex.outputs.summary || steps.gemini_free.outputs.summary }}
        run: |
          rm -rf .gemini gemini-artifacts gha-creds-*.json

          if [ -z "$GEMINI_SUMMARY" ]; then
            echo "::error::Gemini investigation failed on both Vertex AI (${VERTEX_OUTCOME}) and Free Tier (${FREE_OUTCOME}). No report content was generated."
            exit 1
          fi

          REPORT_FILE="/tmp/gemini-renovate-report.md"
          if [[ "$GEMINI_SUMMARY" == *"## 🤖 Gemini ライブラリ更新調査レポート"* ]]; then
            printf "%s\n" "$GEMINI_SUMMARY" > "$REPORT_FILE"
          else
            printf "## 🤖 Gemini ライブラリ更新調査レポート\n\n%s\n" "$GEMINI_SUMMARY" > "$REPORT_FILE"
          fi

          gh pr comment "$PR_NUMBER" --body-file "$REPORT_FILE"
