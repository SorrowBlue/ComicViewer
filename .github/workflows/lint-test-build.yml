name: Lint, Test, and Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'main'
  schedule:
    # 毎日 午前4:00 (JST) / 19:00 (UTC) に main のビルドキャッシュを自動更新
    - cron: '0 19 * * *'

concurrency:
  group: >-
    ${{
      (github.event_name == 'push' &&
       (contains(github.event.head_commit.message, 'internal-release: true') ||
        contains(join(github.event.commits.*.message, ' '), 'internal-release: true'))) &&
      format('{0}-{1}-internal-release-{2}', github.workflow, github.ref, github.run_id) ||
      format('{0}-{1}', github.workflow, github.ref)
    }}
  cancel-in-progress: >-
    ${{
      !(github.event_name == 'push' &&
        (contains(github.event.head_commit.message, 'internal-release: true') ||
         contains(join(github.event.commits.*.message, ' '), 'internal-release: true')))
    }}

permissions:
  contents: read
  actions: write
  checks: write
  issues: write
  pull-requests: write
  security-events: write

jobs:
  check-commit:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      full-check: ${{ steps.check.outputs.full-check }}
      should-run-deps: ${{ steps.check.outputs.should-run-deps }}
      should-run-db-test: ${{ steps.check.outputs.should-run-db-test }}
    steps:
      - name: Checkout code
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Get changed dependency files
        id: changed-dep-files
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            gradle/libs.versions.toml
            **/build.gradle.kts
            settings.gradle.kts
            config/conveyor/**
            .github/workflows/check-dependency-drift.yml
      - name: Get changed database files
        id: changed-db-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            data/database/**
            !data/database/src/commonTest/**
            gradle/libs.versions.toml
      - name: Check execution mode
        id: check
        run: |
          echo "should-run=true" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "full-check=false" >> $GITHUB_OUTPUT
            echo "Decision: Running fast PR checks"
          else
            echo "full-check=true" >> $GITHUB_OUTPUT
            echo "Decision: Running full checks and updating Gradle cache (triggered by ${{ github.event_name }})"
          fi

          if [ "${{ github.event_name }}" = "schedule" ] || \
             [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ steps.changed-dep-files.outputs.any_changed }}" = "true" ]; then
            echo "should-run-deps=true" >> $GITHUB_OUTPUT
            echo "Decision: Running dependency drift check"
          else
            echo "should-run-deps=false" >> $GITHUB_OUTPUT
            echo "Decision: Skipping dependency drift check"
          fi

          if [ "${{ github.event_name }}" != "pull_request" ] || \
             [ "${{ steps.changed-db-files.outputs.any_changed }}" = "true" ]; then
            echo "should-run-db-test=true" >> $GITHUB_OUTPUT
          else
            echo "should-run-db-test=false" >> $GITHUB_OUTPUT
          fi

  lint:
    needs: check-commit
    if: needs.check-commit.outputs.should-run == 'true'
    uses: ./.github/workflows/lint.yml
    with:
      full-check: ${{ needs.check-commit.outputs.full-check == 'true' }}

  test:
    needs: check-commit
    if: needs.check-commit.outputs.should-run == 'true'
    uses: ./.github/workflows/test.yml
    with:
      full-check: ${{ needs.check-commit.outputs.full-check == 'true' }}
      run-db-device-test: ${{ needs.check-commit.outputs.should-run-db-test == 'true' }}

  build:
    needs: check-commit
    if: needs.check-commit.outputs.should-run == 'true'
    uses: ./.github/workflows/build.yml
    with:
      full-check: ${{ needs.check-commit.outputs.full-check == 'true' }}
    secrets: inherit

  dependency-drift:
    needs: check-commit
    if: needs.check-commit.outputs.should-run-deps == 'true'
    uses: ./.github/workflows/check-dependency-drift.yml

  allchecks:
    name: All Checks Passed
    needs: [ check-commit, lint, test, build, dependency-drift ]
    if: always() && cancelled() != true && needs.check-commit.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: wechuli/allcheckspassed@e4240aa9cc76fd6828ce27a71ad16c406c25adb3 # v2
        with:
          poll: false
          delay: 0
          checks_include: '^check-commit,^lint,^test,^build,^dependency-drift'
