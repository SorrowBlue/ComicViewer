name:  Lint, Test, and Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'main'
  schedule:
    # 毎日 午前4:00 (JST) / 19:00 (UTC) に main のビルドキャッシュを自動更新
    - cron: '0 19 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write
  security-events: write

jobs:
  check-commit:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      should-run-deps: ${{ steps.check.outputs.should-run-deps }}
    steps:
      - name: Checkout code
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.event.head_commit.committer.name != 'GitHub')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Get changed dependency files
        id: changed-dep-files
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.event.head_commit.committer.name != 'GitHub')
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            gradle/libs.versions.toml
            **/build.gradle.kts
            settings.gradle.kts
            config/conveyor/**
            .github/workflows/check-dependency-drift.yml
      - name: Check if should run
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "should-run-deps=true" >> $GITHUB_OUTPUT
            echo "Decision: Running workflow and dependency drift check (triggered by ${{ github.event_name }})"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "should-run-deps=false" >> $GITHUB_OUTPUT
            echo "Decision: Running workflow only (triggered by ${{ github.event_name }})"
            exit 0
          fi

          # PRマージ等によるGitHub Web UI経由のpushはすべてスキップ（PR側で実行済みのため）
          if [ "${{ github.event_name }}" = "push" ] && \
             [ "${{ github.event.head_commit.committer.name }}" = "GitHub" ]; then
            echo "should-run=false" >> $GITHUB_OUTPUT
            echo "should-run-deps=false" >> $GITHUB_OUTPUT
            echo "Decision: Skipping all checks (PR merge commit by GitHub)"
            exit 0
          fi

          echo "should-run=true" >> $GITHUB_OUTPUT
          echo "Decision: Running workflow"

          DEP_FILES_CHANGED="${{ steps.changed-dep-files.outputs.any_changed }}"
          if [ "$DEP_FILES_CHANGED" = "true" ]; then
            echo "should-run-deps=true" >> $GITHUB_OUTPUT
            echo "Decision: Running dependency drift check"
          else
            echo "should-run-deps=false" >> $GITHUB_OUTPUT
            echo "Decision: Skipping dependency drift check"
          fi

  lint:
    needs: check-commit
    if: needs.check-commit.outputs.should-run == 'true'
    uses: ./.github/workflows/lint.yml

  test:
    needs: check-commit
    if: needs.check-commit.outputs.should-run == 'true'
    uses: ./.github/workflows/test.yml

  build:
    needs: [ lint, test ]
    if: needs.check-commit.outputs.should-run == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit

  dependency-drift:
    needs: check-commit
    if: needs.check-commit.outputs.should-run-deps == 'true'
    uses: ./.github/workflows/check-dependency-drift.yml

  allchecks:
    name: All Checks Passed
    needs: [ check-commit, lint, test, build, dependency-drift ]
    if: always() && cancelled() != true && needs.check-commit.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: wechuli/allcheckspassed@e4240aa9cc76fd6828ce27a71ad16c406c25adb3 # v2
        with:
          poll: false
          delay: 0
          checks_include: '^check-commit,^lint,^test,^build,^dependency-drift'
