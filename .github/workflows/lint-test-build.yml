name:  Lint, Test, and Build (main PR/push)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  check-commit:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_ignore: |
            **/aboutlibraries.json
      - name: Check if should run
        id: check
        run: |
          IS_AUTO_COMMIT=false
          if [ "${{ github.event_name }}" = "push" ] && \
             [ "${{ github.event.head_commit.committer.name }}" = "GitHub" ]; then
            IS_AUTO_COMMIT=true
          fi
          
          OTHER_FILES_CHANGED="${{ steps.changed-files.outputs.any_changed }}"
          
          if [ "$IS_AUTO_COMMIT" = "false" ] && [ "$OTHER_FILES_CHANGED" = "true" ]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "Decision: Running workflow"
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
            echo "Decision: Skipping workflow"
            echo "Reasoning:"
            echo "  - Is automated push: $IS_AUTO_COMMIT"
            echo "  - Other files changed: $OTHER_FILES_CHANGED"
          fi

  lint:
    needs: check-commit
    if: needs.check-commit.outputs.should-run == 'true'
    uses: ./.github/workflows/lint.yml

  test:
    needs: check-commit
    if: needs.check-commit.outputs.should-run == 'true'
    uses: ./.github/workflows/test.yml

  build:
    needs: [ lint, test ]
    if: needs.check-commit.outputs.should-run == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit

  allchecks:
    name: All Checks Passed
    needs: [ check-commit, lint, test, build ]
    if: always() && cancelled() != true && needs.check-commit.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: wechuli/allcheckspassed@e4240aa9cc76fd6828ce27a71ad16c406c25adb3 # v2
        with:
          poll: false
          delay: 0
          checks_include: '^check-commit,^lint,^test,^build'

  jekyll-build:
    needs: check-commit
    if: needs.check-commit.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create Jekyll source directory
        run: |
          mkdir -p ./jekyll-source
          cp -a docs/. ./jekyll-source/
          mkdir -p ./jekyll-source/.well-known
          mkdir -p ./jekyll-source/dokka
          mkdir -p ./jekyll-source/download
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --source ./jekyll-source --destination ./_site
      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jekyll-site
          path: ./_site
