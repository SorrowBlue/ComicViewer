name: Internal Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to publish'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - android
          - windows
  workflow_run:
    workflows: ["Lint, Test, and Build"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  check-commit:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
    steps:
      - name: Checkout code
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 50
      - name: Check commit message for Internal-release flag
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "Decision: Triggered manually via workflow_dispatch (platform: ${{ inputs.platform }}). Running Internal Release."
            exit 0
          fi

          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          if git rev-parse --verify "${HEAD_SHA}^2" >/dev/null 2>&1; then
            COMMIT_MESSAGES=$(git log "${HEAD_SHA}^1..${HEAD_SHA}" --format=%B)
          else
            COMMIT_MESSAGES=$(git log -1 --format=%B "${HEAD_SHA}")
          fi

          echo "=== Commit Message(s) ==="
          echo "$COMMIT_MESSAGES"
          echo "========================="

          if echo "$COMMIT_MESSAGES" | grep -iqE 'Internal-release:[[:space:]]*true'; then
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "Decision: Found 'Internal-release: true'. Running Internal Release."
          else
            echo "should-release=false" >> $GITHUB_OUTPUT
            echo "Decision: 'Internal-release: true' not found. Skipping Internal Release."
          fi

  android-publish:
    needs: check-commit
    if: >-
      needs.check-commit.outputs.should-release == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android')
    uses: ./.github/workflows/android-publish.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha || '' }}
      build-task: 'bundleInternal'
      aab-path: 'app/androidApp/build/outputs/bundle/internal/androidApp-internal.aab'
      mapping-path: 'app/androidApp/build/outputs/mapping/internal/mapping.txt'
      debug-symbols-path: 'app/androidApp/build/intermediates/merged_native_libs/internal/mergeInternalNativeLibs/out/lib'
      track: 'internalsharing'
      status: 'completed'
    secrets: inherit

  windows-publish:
    needs: check-commit
    if: >-
      needs.check-commit.outputs.should-release == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows')
    uses: ./.github/workflows/windows-publish.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha || '' }}
      channel: 'test-flight'
    secrets: inherit

  notify-android:
    needs: android-publish
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: ":sparkles: Uploaded to internal app share."
          description: |
            Click [here](${{ needs.android-publish.outputs.play-url }}) to download!
          color: 0xff91a4
