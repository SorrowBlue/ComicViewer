name: Release

on:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write
  checks: write
  id-token: write
  security-events: write

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  android-publish:
    needs: [ lint, test ]
    uses: ./.github/workflows/android-publish.yml
    with:
      build-task: 'bundleRelease'
      aab-path: 'app/androidApp/build/outputs/bundle/release/androidApp-release.aab'
      mapping-path: 'app/androidApp/build/outputs/mapping/release/mapping.txt'
      debug-symbols-path: 'app/androidApp/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib'
      track: ${{ contains(github.ref_name, 'beta') && 'beta' || 'production' }}
      status: 'draft'
    secrets: inherit

  windows-publish:
    needs: [ lint, test ]
    uses: ./.github/workflows/windows-publish.yml
    with:
      channel: 'production'
    secrets: inherit

  build-jvm-release:
    needs: [ lint, test ]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: Ubuntu
          - os: macos-latest
            name: Mac
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Run packageDistributionForCurrentOS
        run: ./gradlew packageDistributionForCurrentOS
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-${{ matrix.name }}
          path: app/jvmApp/build/compose/binaries/main/

  upload-release-assets:
    runs-on: ubuntu-latest
    needs: [ android-publish, windows-publish, build-jvm-release ]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ./artifacts
      - name: Display structure of downloaded files
        run: ls -la ./artifacts/**
      - name: Upload Release Assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        if: github.event_name == 'release'
        with:
          files: |
            ./artifacts/jvm-Ubuntu/deb/*
            ./artifacts/jvm-Mac/dmg/*
      - name: Notify Discord - Release Success
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: ":rocket: Release ${{ github.ref_name }} published!"
          description: |
            :white_check_mark: All quality checks passed
            :package: Release artifacts uploaded to GitHub
            :iphone: Android AAB uploaded to Play Console
            :jvm: JVM apps built for Windows, macOS, Linux

            **GitHub Release**:
              [View release](${{ github.event.release.html_url }})
            **Google Play Console**:
              [View Console](${{ needs.android-publish.outputs.play-url }})
          color: 0x00ff00
      - name: Notify Discord - Failure
        if: failure()
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: ":x: Release ${{ github.ref_name }} failed"
          description: |
            The release process encountered an error. Please check the
            workflow logs.

            **Workflow**:
              [View logs](${{ github.server_url }}/${{
                github.repository }}/actions/runs/${{ github.run_id }})
          color: 0xff0000
