name: Release

on:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write
  checks: write
  id-token: write
  security-events: write

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  publish-android:
    needs: [ lint, test ]
    uses: ./.github/workflows/shared/android-publish.yml
    with:
      build-task: 'bundleRelease'
      aab-path: 'app/androidApp/build/outputs/bundle/release/androidApp-release.aab'
      mapping-path: 'app/androidApp/build/outputs/mapping/release/mapping.txt'
      debug-symbols-path: 'app/androidApp/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib'
      track: ${{ contains(github.ref_name, 'beta') && 'beta' || 'production' }}
      status: 'draft'
    secrets: inherit

  publish-desktop:
    needs: [ lint, test ]
    uses: ./.github/workflows/shared/desktop-publish.yml
    with:
      channel: 'production'
    secrets: inherit

  build-jvm-release:
    needs: [ lint, test ]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: Ubuntu
          - os: macos-latest
            name: Mac
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Run packageDistributionForCurrentOS
        run: ./gradlew packageDistributionForCurrentOS
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-${{ matrix.name }}
          path: app/jvmApp/build/compose/binaries/main/

  upload-release-assets:
    runs-on: ubuntu-latest
    needs: [ publish-android, publish-desktop, build-jvm-release ]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
      - name: Display structure of downloaded files
        run: ls -la ./artifacts/**
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'release'
        with:
          files: |
            ./artifacts/jvm-Ubuntu/deb/*
            ./artifacts/jvm-Mac/dmg/*
      - name: Notify Discord - Release Success
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: ":rocket: Release ${{ github.ref_name }} published!"
          description: |
            :white_check_mark: All quality checks passed
            :package: Release artifacts uploaded to GitHub
            :iphone: Android AAB uploaded to Play Console
            :jvm: JVM apps built for Windows, macOS, Linux

            **GitHub Release**:
              [View release](${{ github.event.release.html_url }})
            **Google Play Console**:
              [View Console](${{ needs.publish-android.outputs.play-url }})
          color: 0x00ff00
      - name: Notify Discord - Failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: ":x: Release ${{ github.ref_name }} failed"
          description: |
            The release process encountered an error. Please check the
            workflow logs.

            **Workflow**:
              [View logs](${{ github.server_url }}/${{
                github.repository }}/actions/runs/${{ github.run_id }})
          color: 0xff0000
