name: Release

on:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write
  actions: write
  checks: write
  id-token: write
  security-events: write
  pages: write
  pull-requests: write

jobs:
  verify-ci:
    name: Verify Main CI Status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v7.0.1
      - name: Check Lint, Test, and Build status for commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          TAG_NAME="${{ github.ref_name }}"
          echo "Checking CI status for commit: $COMMIT_SHA (tag: $TAG_NAME)"

          rollback_release() {
            if [ "${{ github.event_name }}" = "release" ]; then
              echo "::warning::Reverting release $TAG_NAME back to draft and deleting tag..."
              gh release edit "$TAG_NAME" --draft || true
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${TAG_NAME}" || true
            fi
          }

          RUN_INFO=$(gh api "repos/${{ github.repository }}/actions/workflows/lint-test-build.yml/runs?head_sha=${COMMIT_SHA}&per_page=1" \
            --jq '.workflow_runs[0] | "\(.id) \(.status) \(.conclusion)"')

          RUN_ID=$(echo "$RUN_INFO" | awk '{print $1}')
          STATUS=$(echo "$RUN_INFO" | awk '{print $2}')
          CONCLUSION=$(echo "$RUN_INFO" | awk '{print $3}')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No CI run found for commit $COMMIT_SHA. Release blocked."
            rollback_release
            exit 1
          fi

          if [ "$STATUS" != "completed" ]; then
            echo "CI run #$RUN_ID is still $STATUS. Waiting for completion..."
            if ! gh run watch "$RUN_ID" --exit-status; then
              echo "::error::CI run #$RUN_ID failed while waiting. Release blocked."
              rollback_release
              exit 1
            fi
            echo "CI run #$RUN_ID completed successfully!"
            exit 0
          fi

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI run #$RUN_ID for commit $COMMIT_SHA did not succeed (conclusion: $CONCLUSION). Release blocked."
            rollback_release
            exit 1
          fi

          echo "CI run #$RUN_ID succeeded! Proceeding with release."

  android-publish:
    needs: [ verify-ci ]
    uses: ./.github/workflows/android-publish.yml
    with:
      build-task: 'bundleRelease'
      aab-path: 'app/androidApp/build/outputs/bundle/release/androidApp-release.aab'
      mapping-path: 'app/androidApp/build/outputs/mapping/release/mapping.txt'
      debug-symbols-path: 'app/androidApp/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib'
      track: ${{ contains(github.ref_name, 'beta') && 'beta' || 'production' }}
      status: 'draft'
    secrets: inherit

  windows-publish:
    needs: [ verify-ci ]
    uses: ./.github/workflows/windows-publish.yml
    with:
      channel: ${{ contains(github.ref_name, 'beta') && 'test-flight' || 'production' }}
    secrets: inherit

  jvm-publish:
    needs: [ verify-ci ]
    uses: ./.github/workflows/jvm-publish.yml
    with:
      tag-name: ${{ github.event.release.tag_name }}
    secrets: inherit

  deploy-pages:
    needs: [ jvm-publish ]
    uses: ./.github/workflows/gh-pages.yml
    with:
      tag-name: ${{ github.event.release.tag_name }}
    secrets: inherit

  notify-release:
    name: Notify Release Results
    runs-on: ubuntu-latest
    needs: [ verify-ci, android-publish, windows-publish, jvm-publish, deploy-pages ]
    if: always()
    steps:
      - name: Notify Discord - Release Success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: ":rocket: Release ${{ github.ref_name }} published!"
          description: |
            :white_check_mark: All quality checks passed
            :package: Release artifacts uploaded to GitHub
            :iphone: Android AAB uploaded to Play Console
            :jvm: JVM apps built for Windows, macOS, Linux
            :spider_web: Download site updated and deployed to GitHub Pages

            **GitHub Release**:
              [View release](${{ github.event.release.html_url }})
            **Google Play Console**:
              [View Console](${{ needs.android-publish.outputs.play-url }})
          color: 0x00ff00

      - name: Notify Discord - Failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: ":x: Release ${{ github.ref_name }} failed"
          description: |
            The release process encountered an error. Please check the
            workflow logs.

            **Workflow**:
              [View logs](${{ github.server_url }}/${{
                github.repository }}/actions/runs/${{ github.run_id }})
          color: 0xff0000
