name: Release

on:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write
  checks: write
  id-token: write
  security-events: write

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  android-publish:
    needs: [ lint, test ]
    uses: ./.github/workflows/android-publish.yml
    with:
      build-task: 'bundleRelease'
      aab-path: 'app/androidApp/build/outputs/bundle/release/androidApp-release.aab'
      mapping-path: 'app/androidApp/build/outputs/mapping/release/mapping.txt'
      debug-symbols-path: 'app/androidApp/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib'
      track: ${{ contains(github.ref_name, 'beta') && 'beta' || 'production' }}
      status: 'draft'
    secrets: inherit

  windows-publish:
    needs: [ lint, test ]
    uses: ./.github/workflows/windows-publish.yml
    with:
      channel: 'production'
    secrets: inherit

  mac-publish:
    needs: [ lint, test ]
    uses: ./.github/workflows/mac-publish.yml
    with:
      channel: 'production'
    secrets: inherit

  linux-publish:
    needs: [ lint, test ]
    uses: ./.github/workflows/linux-publish.yml
    with:
      channel: 'production'
    secrets: inherit

  build-download-site:
    name: Build Download Site
    needs: [ mac-publish, linux-publish ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Linux inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: conveyor-inputs-Ubuntu
          path: ./artifacts/linux

      - name: Download Mac inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: conveyor-inputs-Mac
          path: ./artifacts/mac

      - name: Build Download Site with Conveyor
        uses: hydraulic-software/conveyor/actions/build@5011cc412f9c3a67d8f72f9ea5db5f34c4a68e36 # v22.1
        with:
          command: -f ci.conveyor.conf make site
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          agree_to_license: 1

      - name: Upload site artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: download-site
          path: |
            output/download.html
            output/metadata.properties

  upload-release-assets:
    runs-on: ubuntu-latest
    needs: [ android-publish, windows-publish, mac-publish, linux-publish, build-download-site ]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ./artifacts

      - name: Display structure of downloaded files
        run: ls -la ./artifacts/**

      - name: Upload Release Assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        if: github.event_name == 'release'
        with:
          files: |
            ./artifacts/download-site/download.html
            ./artifacts/download-site/metadata.properties
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Pages Deployment
        run: |
          gh workflow run gh-pages.yml --ref ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord - Release Success
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: ":rocket: Release ${{ github.ref_name }} published!"
          description: |
            :white_check_mark: All quality checks passed
            :package: Release artifacts uploaded to GitHub
            :iphone: Android AAB uploaded to Play Console
            :jvm: JVM apps built for Windows, macOS, Linux
            :spider_web: Download site updated and deployed to GitHub Pages

            **GitHub Release**:
              [View release](${{ github.event.release.html_url }})
            **Google Play Console**:
              [View Console](${{ needs.android-publish.outputs.play-url }})
          color: 0x00ff00
      - name: Notify Discord - Failure
        if: failure()
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: ":x: Release ${{ github.ref_name }} failed"
          description: |
            The release process encountered an error. Please check the
            workflow logs.

            **Workflow**:
              [View logs](${{ github.server_url }}/${{
                github.repository }}/actions/runs/${{ github.run_id }})
          color: 0xff0000
