name: Release

on:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write
  checks: write
  id-token: write
  security-events: write
  pages: write
  pull-requests: write

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  android-publish:
    needs: [ lint, test ]
    uses: ./.github/workflows/android-publish.yml
    with:
      build-task: 'bundleRelease'
      aab-path: 'app/androidApp/build/outputs/bundle/release/androidApp-release.aab'
      mapping-path: 'app/androidApp/build/outputs/mapping/release/mapping.txt'
      debug-symbols-path: 'app/androidApp/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib'
      track: ${{ contains(github.ref_name, 'beta') && 'beta' || 'production' }}
      status: 'draft'
    secrets: inherit

  windows-publish:
    needs: [ lint, test ]
    uses: ./.github/workflows/windows-publish.yml
    with:
      channel: 'production'
    secrets: inherit

  jvm-publish:
    needs: [ lint, test ]
    uses: ./.github/workflows/jvm-publish.yml
    with:
      tag-name: ${{ github.event.release.tag_name }}
    secrets: inherit

  deploy-pages:
    needs: [ android-publish, windows-publish, jvm-publish ]
    uses: ./.github/workflows/gh-pages.yml
    secrets: inherit

  notify-release:
    name: Notify Release Results
    runs-on: ubuntu-latest
    needs: [ android-publish, windows-publish, jvm-publish, deploy-pages ]
    if: always()
    steps:
      - name: Notify Discord - Release Success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: ":rocket: Release ${{ github.ref_name }} published!"
          description: |
            :white_check_mark: All quality checks passed
            :package: Release artifacts uploaded to GitHub
            :iphone: Android AAB uploaded to Play Console
            :jvm: JVM apps built for Windows, macOS, Linux
            :spider_web: Download site updated and deployed to GitHub Pages

            **GitHub Release**:
              [View release](${{ github.event.release.html_url }})
            **Google Play Console**:
              [View Console](${{ needs.android-publish.outputs.play-url }})
          color: 0x00ff00

      - name: Notify Discord - Failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: ":x: Release ${{ github.ref_name }} failed"
          description: |
            The release process encountered an error. Please check the
            workflow logs.

            **Workflow**:
              [View logs](${{ github.server_url }}/${{
                github.repository }}/actions/runs/${{ github.run_id }})
          color: 0xff0000
