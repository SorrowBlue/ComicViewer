name: Release Drafter

on:
  workflow_run:
    workflows: ["Lint, Test, and Build"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update_release_draft:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Update Stable Release Draft
        uses: release-drafter/release-drafter@v7.10.0
        with:
          config-name: release-drafter-stable.yml
          commitish: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update_prerelease_draft:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Update Beta Release Draft
        uses: release-drafter/release-drafter@v7.10.0
        with:
          config-name: release-drafter-beta.yml
          commitish: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
