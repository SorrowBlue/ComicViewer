name: Release Desktop App (Conveyor)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.idea/**'
      - '.run/**'
      - 'config/**'
      - 'docs/**'
      - 'iosApp/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.idea/**'
      - '.run/**'
      - 'config/**'
      - 'docs/**'
      - 'iosApp/**'
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  release-ms-store:
    name: Release to Microsoft Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # PR時はPR元のヘッドコミット、それ以外（mainプッシュやリリースなど）はトリガーされたコミットを確実にチェックアウトします
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # CI環境上にすべてのGitタグと完全な履歴（unshallow）を強制フェッチして、describeが機能するようにします
      - name: Fetch all tags
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "Repository is shallow. Unshallowing..."
            git fetch --unshallow --tags --force
          else
            echo "Repository is already complete. Fetching tags..."
            git fetch --tags --force
          fi

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Calculate Version
        id: versioning
        run: |
          # デバッグ：CI環境で見えているタグとコミットログを出力します
          echo "=== Local Tags ==="
          git tag
          echo "=== Git Log ==="
          git log --oneline --graph --decorate -n 15
          
          # 1. 正式タグ（v*.*.*、beta除く）からのGitコミット距離（Distance）を取得
          distance=$(git describe --tags --long --match "v[0-9]*.[0-9]*.[0-9]*" --exclude "*beta*" 2>/dev/null | awk -F'-' '{print $(NF-1)}')
          distance=${distance:-0}
          
          # 2. Gradleのpropertiesからベースバージョン（3桁）を取得
          base_version=$(./gradlew -q :app:jvmApp:properties | grep "^version:" | cut -d' ' -f2 | cut -d'-' -f1)
          
          # 3. 4桁のフルバージョンを合成して出力
          full_version="${base_version}.${distance}"
          echo "FULL_VERSION=${full_version}" >> $GITHUB_OUTPUT
          echo "Calculated version: ${full_version}"

      - name: Build JVM Application
        run: ./gradlew :app:jvmApp:jvmJar

      - name: Run Conveyor to release to Microsoft Store
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          # 合成した 4桁のバージョンを -Kapp.version で上書き指定し、かつmainへのpush/PR時はテストフライトIDも -K オプションで上書き指定します
          command: -Kapp.version=${{ steps.versioning.outputs.FULL_VERSION }} ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && format('-Kapp.windows.store.flight-id={0} ', secrets.MS_STORE_TEST_FLIGHT_ID) || '' }}make ms-store-release
          # GitHub Secretsに登録されたルート署名キーを指定
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          # ライセンスへの同意（CIで実行する際に必須）
          agree_to_license: 1
        env:
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
