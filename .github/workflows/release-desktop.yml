name: Release Desktop App (Conveyor)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.idea/**'
      - '.run/**'
      - 'config/**'
      - 'docs/**'
      - 'iosApp/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.idea/**'
      - '.run/**'
      - 'config/**'
      - 'docs/**'
      - 'iosApp/**'
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  release-ms-store:
    name: Release to Microsoft Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Calculate Version
        id: versioning
        run: |
          # 1. 正式タグ（v*.*.*、beta除く）からのGitコミット距離（Distance）を取得
          distance=$(git describe --tags --long --match "v[0-9]*.[0-9]*.[0-9]*" --exclude "*beta*" 2>/dev/null | awk -F'-' '{print $(NF-1)}')
          distance=${distance:-0}
          
          # 2. Gradleのpropertiesからベースバージョン（3桁）を取得
          base_version=$(./gradlew -q :app:jvmApp:properties | grep "^version:" | cut -d' ' -f2 | cut -d'-' -f1)
          
          # 3. 4桁 of フルバージョンを合成して出力
          full_version="${base_version}.${distance}"
          echo "FULL_VERSION=${full_version}" >> $GITHUB_OUTPUT
          echo "Calculated version: ${full_version}"

      - name: Build JVM Application
        run: ./gradlew :app:jvmApp:jvmJar

      # 🌟 PUSH時やPR時（検証・テストフェーズ）: ConveyorでMSIXをビルド・署名し、自前スクリプトでテストフライトへアップロードします
      - name: Build MSIX Package (Validation)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: -Kapp.version=${{ steps.versioning.outputs.FULL_VERSION }} make windows-msix
          signing_key: ${{ secrets.CONVOR_SIGNING_KEY }}
          # 実際には CONVEYOR_SIGNING_KEY ですが、スペルミスに注意します。
          # シークレット名は CONVEYOR_SIGNING_KEY なので、以下に修正します。
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          agree_to_license: 1

      - name: Upload MSIX to Microsoft Store Test Flight
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: pwsh scripts/upload_to_flight.ps1
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_FLIGHT_ID: ${{ secrets.MS_STORE_TEST_FLIGHT_ID }}

      # 🌟 GitHubリリース公開時（正式リリースフェーズ）: Conveyorの機能で製品版ストアへ提出します
      - name: Run Conveyor to release to Microsoft Store (Production)
        if: github.event_name == 'release'
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: -Kapp.version=${{ steps.versioning.outputs.FULL_VERSION }} make ms-store-release
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          agree_to_license: 1
        env:
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
