name: Release Desktop App (Conveyor)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.idea/**'
      - '.run/**'
      - 'config/**'
      - 'docs/**'
      - 'iosApp/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.idea/**'
      - '.run/**'
      - 'config/**'
      - 'docs/**'
      - 'iosApp/**'
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  release-ms-store:
    name: Release to Microsoft Store
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Build JVM Application
        run: ./gradlew :app:jvmApp:jar

      - name: Run Conveyor to release to Microsoft Store
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          # mainへのpushまたはpull_request時はテスト用フライトIDを -K オプションで上書き指定し、それ以外（本番リリースなど）は通常の製品版リリースとします
          command: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && format('-Kapp.windows.store.flight-id={0} ', secrets.MS_STORE_TEST_FLIGHT_ID) || '' }}make ms-store-release
          # GitHub Secretsに登録されたルート署名キーを指定
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          # ライセンスへの同意（CIで実行する際に必須）
          agree_to_license: 1
        env:
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
