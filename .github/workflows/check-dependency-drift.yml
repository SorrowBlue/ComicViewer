name: Check Dependency Configuration Drift

on:
  push:
    branches:
      - main
    paths:
      - 'gradle/libs.versions.toml'
      - '**/build.gradle.kts'
      - 'settings.gradle.kts'
      - 'config/conveyor/**'
      - '.github/workflows/check-dependency-drift.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'gradle/libs.versions.toml'
      - '**/build.gradle.kts'
      - 'settings.gradle.kts'
      - 'config/conveyor/**'
      - '.github/workflows/check-dependency-drift.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-drift:
    name: Extract Deps on ${{ matrix.os-name }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os-name: Linux
          - os: macos-latest
            os-name: macOS
          - os: windows-latest
            os-name: Windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Inspect Conveyor dependencies and JAR native binaries
        run: |
          ./gradlew :app:jvmApp:inspectConveyorDependencies
          cp app/jvmApp/build/conveyor/deps.txt "./deps-${{ matrix.os-name }}.txt"
          cp app/jvmApp/build/conveyor/native-errors.txt "./native-errors-${{ matrix.os-name }}.txt"

      - name: Upload dependency check artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deps-${{ matrix.os-name }}
          path: |
            ./deps-${{ matrix.os-name }}.txt
            ./native-errors-${{ matrix.os-name }}.txt
          if-no-files-found: error

  verify-dependencies:
    name: Verify Multi-OS Dependencies
    needs: [ check-drift ]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all dependency artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Verify cross-OS consistency (Method 1) and JAR native completeness (Method 2)
        run: |
          HAS_ERROR=false
          BODY_FILE="./issue_body.md"

          cat << 'EOF' > "$BODY_FILE"
          ## OS-specific dependency detected

          A dependency that differs across target OSes or lacks native binaries for all target desktop platforms (Windows, Linux, macOS) was detected.
          Please verify the Conveyor configuration (`config/conveyor/conveyor.conf`) and Gradle dependencies (`app/jvmApp/build.gradle.kts`).

          EOF

          # 方法1: Linux を基準に macOS / Windows との解決結果の不一致をチェック
          for TARGET_OS in "macOS" "Windows"; do
            DIFF_FILE="./diff-Linux-vs-${TARGET_OS}.txt"
            diff -u "./artifacts/deps-Linux.txt" "./artifacts/deps-${TARGET_OS}.txt" > "$DIFF_FILE" || true
            if [ -s "$DIFF_FILE" ]; then
              HAS_ERROR=true
              echo "### [Method 1] Dependency resolution mismatch: Linux vs ${TARGET_OS}" >> "$BODY_FILE"
              echo "\`\`\`diff" >> "$BODY_FILE"
              cat "$DIFF_FILE" >> "$BODY_FILE"
              echo -e "\n\`\`\`\n" >> "$BODY_FILE"
            fi
          done

          # 方法2: 各 OS で解決された JAR 内のネイティブバイナリ欠落・OS固有アーティファクト名をチェック
          for OS in "Linux" "macOS" "Windows"; do
            ERR_FILE="./artifacts/native-errors-${OS}.txt"
            if [ -s "$ERR_FILE" ]; then
              HAS_ERROR=true
              echo "### [Method 2] JAR native binary / artifact name issues on ${OS}" >> "$BODY_FILE"
              echo "\`\`\`text" >> "$BODY_FILE"
              cat "$ERR_FILE" >> "$BODY_FILE"
              echo -e "\n\`\`\`\n" >> "$BODY_FILE"
            fi
          done

          if [ "$HAS_ERROR" = true ]; then
            cat "$BODY_FILE" >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Posting comment to Pull Request #${{ github.event.pull_request.number }}..."
              gh pr comment "${{ github.event.pull_request.number }}" --body-file "$BODY_FILE"
            elif [ "${{ github.event_name }}" = "push" ]; then
              echo "Creating GitHub Issue for main branch push..."
              gh issue create --title "[Dependency Check] OS-specific dependency detected" --body-file "$BODY_FILE"
            fi
            echo "OS-specific dependency issue detected. Failing check."
            exit 1
          else
            echo "All dependencies are consistent across Linux, macOS, and Windows, and all native JARs bundle binaries for all 3 OSes."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
