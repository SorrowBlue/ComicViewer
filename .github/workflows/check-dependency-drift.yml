name: Check Dependency Configuration Drift

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-drift:
    name: Extract Deps on ${{ matrix.os-name }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os-name: Linux
          - os: macos-latest
            os-name: macOS
          - os: windows-latest
            os-name: Windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Inspect Conveyor dependencies and JAR native binaries
        run: |
          ./gradlew :app:jvmApp:inspectConveyorDependencies
          cp app/jvmApp/build/conveyor/deps.txt "./deps-${{ matrix.os-name }}.txt"
          cp app/jvmApp/build/conveyor/native-errors.txt "./native-errors-${{ matrix.os-name }}.txt"

      - name: Upload dependency check artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deps-${{ matrix.os-name }}
          path: |
            ./deps-${{ matrix.os-name }}.txt
            ./native-errors-${{ matrix.os-name }}.txt
          if-no-files-found: error

  verify-dependencies:
    name: Verify Multi-OS Dependencies
    needs: [ check-drift ]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all dependency artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Verify cross-OS consistency (Method 1) and JAR native completeness (Method 2)
        run: |
          HAS_ERROR=false
          BODY_FILE="./issue_body.md"
          RAW_COORDS_FILE="./raw_coords.txt"
          > "$RAW_COORDS_FILE"

          normalize_lib_key() {
            local ga="${1%:*}"
            echo "$ga" | sed -E 's/[-_.](windows|win32|win64|linux|macos|osx|darwin)([-_.][a-zA-Z0-9_]+)*$//I'
          }

          cat << 'EOF' > "$BODY_FILE"
          ## OS-specific dependency detected

          A dependency that differs across target OSes or lacks native binaries for all target desktop platforms (Windows, Linux, macOS) was detected.
          Please verify the Conveyor configuration (`config/conveyor/conveyor.conf`) and Gradle dependencies (`app/jvmApp/build.gradle.kts`).

          EOF

          # 方法1: Linux を基準に macOS / Windows との解決結果の不一致をチェック
          for TARGET_OS in "macOS" "Windows"; do
            DIFF_FILE="./diff-Linux-vs-${TARGET_OS}.txt"
            diff -u "./artifacts/deps-Linux.txt" "./artifacts/deps-${TARGET_OS}.txt" > "$DIFF_FILE" || true
            if [ -s "$DIFF_FILE" ]; then
              HAS_ERROR=true
              grep -E '^[+-][^+-]' "$DIFF_FILE" | sed 's/^[+-]//' >> "$RAW_COORDS_FILE" || true
              echo "### [Method 1] Dependency resolution mismatch: Linux vs ${TARGET_OS}" >> "$BODY_FILE"
              echo "\`\`\`diff" >> "$BODY_FILE"
              cat "$DIFF_FILE" >> "$BODY_FILE"
              echo -e "\n\`\`\`\n" >> "$BODY_FILE"
            fi
          done

          # 方法2: 各 OS で解決された JAR 内のネイティブバイナリ欠落・OS固有アーティファクト名をチェック
          for OS in "Linux" "macOS" "Windows"; do
            ERR_FILE="./artifacts/native-errors-${OS}.txt"
            if [ -s "$ERR_FILE" ]; then
              HAS_ERROR=true
              sed -E 's/^\[[^]]+\] ([^ ]+).*/\1/' "$ERR_FILE" >> "$RAW_COORDS_FILE" || true
              echo "### [Method 2] JAR native binary / artifact name issues on ${OS}" >> "$BODY_FILE"
              echo "\`\`\`text" >> "$BODY_FILE"
              cat "$ERR_FILE" >> "$BODY_FILE"
              echo -e "\n\`\`\`\n" >> "$BODY_FILE"
            fi
          done

          if [ "$HAS_ERROR" = true ]; then
            cat "$BODY_FILE" >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Posting comment to Pull Request #${{ github.event.pull_request.number }}..."
              gh pr comment "${{ github.event.pull_request.number }}" --body-file "$BODY_FILE"
            elif [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "schedule" ]; then
              LIB_KEYS_FILE="./lib_keys.txt"
              > "$LIB_KEYS_FILE"
              while IFS= read -r coord; do
                [ -z "$coord" ] && continue
                normalize_lib_key "$coord" >> "$LIB_KEYS_FILE"
              done < "$RAW_COORDS_FILE"
              sort -u "$LIB_KEYS_FILE" -o "$LIB_KEYS_FILE"

              while IFS= read -r LIB_KEY; do
                [ -z "$LIB_KEY" ] && continue
                LIB_BODY_FILE="./issue_body_lib.md"
                cat << EOF > "$LIB_BODY_FILE"
          ## OS-specific dependency detected: \`${LIB_KEY}\`

          A dependency associated with \`${LIB_KEY}\` differs across target OSes or lacks native binaries for all target desktop platforms (Windows, Linux, macOS).
          Please verify the Conveyor configuration (\`config/conveyor/conveyor.conf\`) and Gradle dependencies (\`app/jvmApp/build.gradle.kts\`).

          EOF

                for TARGET_OS in "macOS" "Windows"; do
                  DIFF_FILE="./diff-Linux-vs-${TARGET_OS}.txt"
                  if [ -s "$DIFF_FILE" ] && grep -E '^[+-][^+-]' "$DIFF_FILE" | grep -Fq "$LIB_KEY"; then
                    echo "### [Method 1] Dependency resolution mismatch: Linux vs ${TARGET_OS}" >> "$LIB_BODY_FILE"
                    echo "\`\`\`diff" >> "$LIB_BODY_FILE"
                    grep -E "^(---|\\+\\+\\+|@@|[+-].*${LIB_KEY})" "$DIFF_FILE" >> "$LIB_BODY_FILE" || true
                    echo -e "\n\`\`\`\n" >> "$LIB_BODY_FILE"
                  fi
                done

                for OS in "Linux" "macOS" "Windows"; do
                  ERR_FILE="./artifacts/native-errors-${OS}.txt"
                  if [ -s "$ERR_FILE" ] && grep -Fq "$LIB_KEY" "$ERR_FILE"; then
                    echo "### [Method 2] JAR native binary / artifact name issues on ${OS}" >> "$LIB_BODY_FILE"
                    echo "\`\`\`text" >> "$LIB_BODY_FILE"
                    grep -F "$LIB_KEY" "$ERR_FILE" >> "$LIB_BODY_FILE" || true
                    echo -e "\n\`\`\`\n" >> "$LIB_BODY_FILE"
                  fi
                done

                ISSUE_TITLE="[Dependency Check] OS-specific dependency detected: ${LIB_KEY}"
                EXISTING_ISSUE=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)

                if [ -n "$EXISTING_ISSUE" ]; then
                  echo "Open issue #$EXISTING_ISSUE already exists for ${LIB_KEY}. Updating body..."
                  gh issue edit "$EXISTING_ISSUE" --body-file "$LIB_BODY_FILE"
                else
                  echo "Creating GitHub Issue for ${LIB_KEY}..."
                  gh issue create --title "$ISSUE_TITLE" --body-file "$LIB_BODY_FILE"
                fi
              done < "$LIB_KEYS_FILE"
            fi
            echo "OS-specific dependency issue detected. Failing check."
            exit 1
          else
            echo "All dependencies are consistent across Linux, macOS, and Windows, and all native JARs bundle binaries for all 3 OSes."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
