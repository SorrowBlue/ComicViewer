name: Internal App Sharing

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.idea/**'
      - '.run/**'
      - 'config/**'
      - 'docs/**'
      - 'iosApp/**'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/shared/android-publish.yml
    with:
      build-task: 'bundleInternal'
      aab-path: 'app/androidApp/build/outputs/bundle/internal/androidApp-internal.aab'
      mapping-path: 'app/androidApp/build/outputs/mapping/internal/mapping.txt'
      debug-symbols-path: 'app/androidApp/build/intermediates/merged_native_libs/internal/mergeInternalNativeLibs/out/lib'
      track: 'internalsharing'
      status: 'completed'
    secrets: inherit

  notify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: ":sparkles: Uploaded to internal app share."
          description: |
            Click [here](${{ needs.publish.outputs.play-url }}) to download!
          color: 0xff91a4
