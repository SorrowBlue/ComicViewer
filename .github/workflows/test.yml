name: Test

on:
  workflow_call:

jobs:

  unit-test:
    name: Unit Test (${{ matrix.tasks }} - ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            tasks: "jvmTest testAndroidHostTest"
          - shard: 2
            tasks: "jvmTest testAndroidHostTest"
          - shard: 3
            tasks: "jvmTest testAndroidHostTest"
          - shard: 4
            tasks: "jvmTest testAndroidHostTest"
          - shard: 5
            tasks: "jvmTest testAndroidHostTest"
          - shard: 6
            tasks: "jvmTest"
          - shard: 7
            tasks: "jvmTest"
          - shard: 8
            tasks: "jvmTest"
          - shard: 9
            tasks: "jvmTest"
          - shard: 10
            tasks: "jvmTest"

    services:
      samba: &samba_settings
        image: dperson/samba
        ports:
          - 445:445
        env:
          USER: "testuser;testpass"
          SHARE: "testshare;/mnt/share"
        volumes:
          - ${{ github.workspace }}/../samba_share:/mnt/share
        options: >-
          --name samba-server

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup samba
        uses: ./.github/actions/setup_samba
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Run Unit Tests
        run: >
          ./gradlew ${{ matrix.tasks }} --continue
          -PsmbHost=localhost
          -PsmbPort=445
          -PsmbUsername=testuser
          -PsmbPassword=testpass
          -PsmbPath="/testshare/testfolder/"
      - name: Upload Test Report
        if: cancelled() != true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: 'Unit Test (${{ matrix.tasks }} - ${{ matrix.shard }})'
          path: '**/build/test-results/*/TEST-*.xml'
          reporter: 'java-junit'
          fail-on-error: false
      - name: Upload JVM/Android Test Reports on Failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.shard }}
          path: |
            **/build/reports/tests/**/*
            **/build/test-results/**/*
          if-no-files-found: ignore

