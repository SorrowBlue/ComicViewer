name: Test

on:
  workflow_call:
    inputs:
      full-check:
        description: 'Whether to run full test suite including Large tests and full emulator tests'
        required: false
        type: boolean
        default: true
      run-db-device-test:
        description: 'Whether to run :data:database device tests on PR'
        required: false
        type: boolean
        default: false

jobs:

  jvm-test:
    name: JVM Test
    runs-on: ubuntu-latest

    services:
      samba: &samba_settings
        image: dperson/samba
        ports:
          - 445:445
        env:
          USER: "testuser;testpass"
          SHARE: "testshare;/mnt/share"
        volumes:
          - ${{ github.workspace }}/../samba_share:/mnt/share
        options: >-
          --name samba-server

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup samba
        uses: ./.github/actions/setup_samba
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Run JVM Tests (Full)
        if: ${{ inputs.full-check }}
        run: >
          ./gradlew jvmTest --continue
          -PsmbHost=localhost
          -PsmbPort=445
          -PsmbUsername=testuser
          -PsmbPassword=testpass
          -PsmbPath="/testshare/testfolder/"
      - name: Run JVM Tests (Small & Medium)
        if: ${{ !inputs.full-check }}
        run: >
          ./gradlew jvmTest --continue
          -PexcludeTestSize=large
          -PsmbHost=localhost
          -PsmbPort=445
          -PsmbUsername=testuser
          -PsmbPassword=testpass
          -PsmbPath="/testshare/testfolder/"
      - name: Upload Test Report
        if: cancelled() != true
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: 'JVM Test'
          path: '**/build/test-results/*/TEST-*.xml'
          reporter: 'java-junit'
          fail-on-error: false
      - name: Upload JVM Test Reports on Failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: |
            **/build/reports/tests/jvmTest/**/*
            **/build/test-results/jvmTest/**/*
          if-no-files-found: ignore

  android-host-test:
    name: Android Host Test
    runs-on: ubuntu-latest

    services:
      samba: *samba_settings

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup samba
        uses: ./.github/actions/setup_samba
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Run Android Host Tests
        run: >
          ./gradlew testAndroidHostTest :app:androidApp:testDebugUnitTest --continue
          -PsmbHost=localhost
          -PsmbPort=445
          -PsmbUsername=testuser
          -PsmbPassword=testpass
          -PsmbPath="/testshare/testfolder/"
      - name: Upload Test Report
        if: cancelled() != true
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: 'Android Host Test'
          path: '**/build/test-results/*/TEST-*.xml'
          reporter: 'java-junit'
          fail-on-error: false
      - name: Upload Android Host Test Reports on Failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-host-test-reports
          path: |
            **/build/reports/tests/testAndroidHostTest/**/*
            **/build/test-results/testAndroidHostTest/**/*
            **/build/reports/tests/testDebugUnitTest/**/*
            **/build/test-results/testDebugUnitTest/**/*
          if-no-files-found: ignore

  instrumentation-test:
    name: Instrumentation Test
    if: ${{ inputs.full-check || inputs.run-db-device-test }}
    runs-on: ubuntu-latest

    services:
      samba: *samba_settings

    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup samba
        if: ${{ inputs.full-check }}
        uses: ./.github/actions/setup_samba
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Run Instrumentation tests (Full)
        if: ${{ inputs.full-check }}
        timeout-minutes: 20
        run: >
          ./gradlew pixel7pro35AndroidDeviceTest --continue
          -PsmbHost=10.0.2.2
          -PsmbPort=445
          -PsmbUsername=testuser
          -PsmbPassword=testpass
          -PsmbPath="/testshare/testfolder/"
      - name: Run Instrumentation tests (Database only)
        if: ${{ !inputs.full-check && inputs.run-db-device-test }}
        timeout-minutes: 15
        run: ./gradlew :data:database:pixel7pro35AndroidDeviceTest --continue
      - name: Upload Test Report
        if: cancelled() != true
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: 'Instrumentation Test'
          path: '**/build/outputs/*Test-results/**/TEST-*.xml'
          reporter: 'java-junit'
          fail-on-error: false
      - name: Upload Crash Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-crash-logs
          path: |
            **/build/outputs/androidTest-results/managedDevice/**/*.txt
            **/build/reports/androidTests/managedDevice/**/*
          if-no-files-found: ignore

  konture-test:
    name: Konture Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Run Konture Architecture Tests
        run: >
          ./gradlew :konture-test:test -Dorg.gradle.configureondemand=false
