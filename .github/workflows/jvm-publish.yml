name: JVM Publish

on:
  workflow_call:
    inputs:
      tag-name:
        type: string
        description: 'GitHub Release Tag Name to upload assets to (leave empty to skip upload)'
        required: false
        default: ''

jobs:
  build-jvm-apps:
    name: Build JVM Apps & Download Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup JDK and Gradle
        uses: $/.github/actions/setup-java-gradle

      - name: 🖥️ ExportLibraryDefinitions
        run: ./gradlew :app:jvmApp:exportLibraryDefinitions
        env:
          ORG_GRADLE_PROJECT_githubApiToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Build JVM Jar
        run: ./gradlew :app:jvmApp:jvmJar

      - name: Build Apps and Site with Conveyor
        uses: hydraulic-software/conveyor/actions/build@v22.3
        with:
          command: -f config/conveyor/ci.conveyor.conf -K='app.machines=[linux, mac]' make site
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          agree_to_license: 1

      - name: Archive download site files for Release Assets fallback
        run: |
          cd output
          zip -r download-site.zip download.html icon.svg
          rm download.html icon.svg
          cd ..

      - name: Upload JVM installers (for Release Assets Archive)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jvm-installers
          path: |
            output/**

      - name: Upload Release Assets to GitHub Releases
        if: ${{ inputs.tag-name != '' }}
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            output/**
          tag_name: ${{ inputs.tag-name }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up Conveyor caches to preserve Gradle cache quota
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(gh cache list --json id,key --jq '.[] | select(.key | startswith("conveyor-")) | .id'); do
            echo "Deleting conveyor cache $id..."
            gh cache delete "$id" || true
          done
