name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Setup JDK and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Generate Dokka
        timeout-minutes: 30
        run: ./gradlew dokkaGenerate --max-workers=1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: artifact-upload-step
        with:
          name: kdoc-html
          include-hidden-files: true
          path: |
            build/dokka/html/
            docs/
          retention-days: 1

  jekyll-build:
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - name: Download KDoc artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kdoc-html
      - name: Move dokka html to root dokka/
        run: |
          mkdir -p dokka
          cp -a build/dokka/html/. dokka/
          rm -rf build
      - name: Move docs to root
        run: |
          cp -a docs/. ./
          rm -rf docs
      - name: Setup Ruby
        uses: ruby/setup-ruby@ec02537da5712d66d4d50a0f3ec1aec69527ad90 # v1.193.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Jekyll
        run: bundle exec jekyll build --source ./ --destination ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffbe7e37975b403859a41 # v3.0.1
        with:
          path: ./_site
  deploy:
    if: github.event_name != 'pull_request'
    needs: jekyll-build
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
