name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      tag-name:
        type: string
        description: 'GitHub Release Tag Name to download assets from (leave empty for latest)'
        required: false
        default: ''
  workflow_call:
    inputs:
      tag-name:
        type: string
        description: 'GitHub Release Tag Name to download assets from (leave empty for latest)'
        required: false
        default: ''


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup JDK and Gradle
        uses: $/.github/actions/setup-java-gradle
      - name: Generate Dokka
        timeout-minutes: 30
        run: ./gradlew :dokkaGenerate --max-workers=1
      - uses: actions/upload-artifact@v7.0.2
        id: artifact-upload-step
        with:
          name: kdoc-html
          include-hidden-files: true
          path: build/dokka/html/
          retention-days: 1

  jekyll-build:
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Create Jekyll source directory
        run: |
          mkdir -p ./jekyll-source
          cp -a docs/. ./jekyll-source/

      - name: Download KDoc artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: kdoc-html
          path: ./jekyll-source/dokka

      - name: Download download-site.zip from GitHub Release
        run: |
          mkdir -p ./jekyll-source/download
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ inputs.tag-name }}"
          fi

          
          if [ -n "$TAG" ]; then
            echo "Downloading download-site.zip from release tag: $TAG"
            gh release download "$TAG" --repo ${{ github.repository }} \
              --pattern "download-site.zip" \
              --dir ./jekyll-source/download || true
          else
            echo "No release tag specified. Downloading download-site.zip from latest GitHub Release..."
            gh release download --repo ${{ github.repository }} \
              --pattern "download-site.zip" \
              --dir ./jekyll-source/download || true
          fi
          
          # zipの解凍
          if [ -f ./jekyll-source/download/download-site.zip ]; then
            unzip -o ./jekyll-source/download/download-site.zip -d ./jekyll-source/download/
            mv ./jekyll-source/download/download.html ./jekyll-source/download/index.html
            rm ./jekyll-source/download/download-site.zip
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: '4.0.9'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Build with Jekyll
        run: bundle exec jekyll build --source ./jekyll-source --destination ./_site

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./_site

  deploy:
    needs: jekyll-build
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
