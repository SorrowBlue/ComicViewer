name: Build

on:
  workflow_call:
    inputs:
      full-check:
        description: 'Whether to run full packaging builds (MSIX, Smoke Test, xcodebuild)'
        required: false
        type: boolean
        default: true

jobs:
  android-build:
    name: Android
    runs-on: ubuntu-latest
    environment: android
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Java and Gradle
        uses: $/.github/actions/setup-java-gradle
      - name: Decode android keystore file
        id: android_keystore
        uses: timheuer/base64-to-file@v2.0.0
        with:
          fileName: 'android_keystore.jks'
          encodedString: ${{ secrets.ANDROID_STORE_FILE_BASE64 }}
      - name: 🤖 ExportLibraryDefinitions
        if: ${{ inputs.full-check }}
        run: ./gradlew :app:androidApp:exportLibraryDefinitions
        env:
          ORG_GRADLE_PROJECT_githubApiToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Run assemblePrerelease
        run: ./gradlew assemblePrerelease
        env:
          ORG_GRADLE_PROJECT_androidSigningStoreFile: ${{ steps.android_keystore.outputs.filePath }}
          ORG_GRADLE_PROJECT_androidSigningStorePassword: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_androidSigningKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_androidSigningKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Upload artifact
        if: ${{ inputs.full-check }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android
          path: app/androidApp/build/outputs/

  jvm-build:
    name: ${{ inputs.full-check && 'JVM (Windows MSIX Build on Linux)' || 'JVM (Jar Build Check)' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Java and Gradle
        uses: $/.github/actions/setup-java-gradle
      - name: 🖥️ ExportLibraryDefinitions
        if: ${{ inputs.full-check }}
        run: ./gradlew :app:jvmApp:exportLibraryDefinitions
        env:
          ORG_GRADLE_PROJECT_githubApiToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Build JVM Jar
        run: ./gradlew :app:jvmApp:jvmJar
      - name: Build Windows MSIX Package
        if: ${{ inputs.full-check }}
        uses: hydraulic-software/conveyor/actions/build@v22.3
        with:
          command: -f config/conveyor/ci.conveyor.conf -K='app.machines=[windows.amd64]' make windows-msix
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          agree_to_license: 1
      - name: Upload artifact
        if: ${{ inputs.full-check }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jvm-windows-msix
          path: output/*.msix
      - name: Clean up Conveyor caches to preserve Gradle cache quota
        if: always() && inputs.full-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(gh cache list --json id,key --jq '.[] | select(.key | startswith("conveyor-")) | .id'); do
            echo "Deleting conveyor cache $id..."
            gh cache delete "$id" || true
          done

  windows-smoke-test:
    name: Windows Smoke Test
    if: ${{ inputs.full-check }}
    needs: jvm-build
    runs-on: windows-latest
    steps:
      - name: Download Windows MSIX artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: jvm-windows-msix
          path: output
      - name: Extract MSIX and run smoke test
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path output -Filter "*.msix" | Select-Object -First 1
          if (-not $msix) {
            throw "No .msix file found in output directory"
          }
          Write-Host "Extracting $($msix.FullName)..."
          7z x $msix.FullName -oextracted -y | Out-Null

          $exe = Get-ChildItem -Path "extracted\bin" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "App executable not found in extracted\bin"
          }

          $errLog = Join-Path $PWD "smoke-test-error.log"
          $env:COMICVIEWER_SMOKE_TEST_LOG = $errLog

          Write-Host "Launching $($exe.FullName) --smoke-test ..."
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test" -WorkingDirectory $exe.DirectoryName -PassThru

          if (-not $proc.WaitForExit(45000)) {
            $proc.Kill()
            if (Test-Path $errLog) {
              Write-Host "=== smoke-test-error.log ==="
              Get-Content $errLog
            }
            throw "Smoke test timed out after 45 seconds."
          }

          if (Test-Path $errLog) {
            Write-Host "=== smoke-test-error.log ==="
            Get-Content $errLog
          }

          if ($proc.ExitCode -ne 0) {
            throw "Smoke test failed with exit code $($proc.ExitCode)"
          }
          Write-Host "Smoke test passed successfully!"

  ios-compile-check:
    name: iOS (Kotlin Klib Check)
    if: ${{ !inputs.full-check }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Java and Gradle
        uses: $/.github/actions/setup-java-gradle
      - name: Compile iOS Kotlin Framework (Cross-Compile on Linux)
        run: ./gradlew :app:ios:compileKotlinIosSimulatorArm64

  ios-build:
    name: iOS
    if: ${{ inputs.full-check }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Java and Gradle
        uses: $/.github/actions/setup-java-gradle
      - name: 📱 ExportLibraryDefinitions
        run: ./gradlew :app:ios:exportLibraryDefinitions
        env:
          ORG_GRADLE_PROJECT_githubApiToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Build iOS App (Simulator)
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGN_IDENTITY=""
          CODE_SIGNING_REQUIRED=NO
          build
