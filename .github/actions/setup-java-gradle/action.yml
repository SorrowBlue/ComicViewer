name: Setup Java and Gradle
runs:
  using: "composite"
  steps:
    - name: Setup JDK 21
      uses: actions/setup-java@v6.2.0
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Run chmod to make gradlew executable
      shell: bash
      run: chmod +x ./gradlew
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.4.1
